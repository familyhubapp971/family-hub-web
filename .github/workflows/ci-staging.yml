# ci-staging: full validation on every push to staging.
# Runs the full e2e matrix + a perf smoke against the running api.
# Can take longer than PR CI.
#
# Per CLAUDE.md "Pipeline orchestration":
#   - PR CI gates merge (ci-pr-staging.yml)
#   - This runs AFTER merge to staging — informational + catches matrix
#     differences chromium-only didn't catch.
#
# webkit project removed from matrix — playwright.config.ts only
# declares chromium + mobile-chrome. Re-add when FHS-182 follow-up
# adds the webkit project + Linux deps audit.

name: ci-staging

on:
  push:
    branches:
      - staging

concurrency:
  group: ci-staging
  cancel-in-progress: false # let prior runs finish — they're informational

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.32.0'

jobs:
  e2e-full:
    name: Browser tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, mobile-chrome]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familyhub_test
          POSTGRES_USER: fh_test
          POSTGRES_PASSWORD: fh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      FH_API_DIR: ${{ github.workspace }}/.ci-api
      DATABASE_URL: postgres://fh_test:fh_test@localhost:5432/familyhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # FHS-688: the browser tests boot the server from family-hub-api.
      - uses: actions/checkout@v4
        with:
          repository: familyhubapp971/family-hub-api
          ref: staging
          path: .ci-api
      - run: pnpm --dir .ci-api install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        env:
          BROWSER: ${{ matrix.browser }}
        # Map mobile-chrome to chromium binary (Pixel 5 device profile uses chromium).
        run: |
          case "$BROWSER" in
            mobile-chrome) pnpm -F @familyhub/e2e exec playwright install --with-deps chromium ;;
            *) pnpm -F @familyhub/e2e exec playwright install --with-deps "$BROWSER" ;;
          esac
      - name: Apply DB migrations for the e2e api
        # FHS-277 — the api the tests boot ran against an EMPTY service
        # postgres (no step ever created the schema), so every DB-backed
        # authed route 500'd. Same migrations the integration tier applies.
        run: pnpm --dir .ci-api exec drizzle-kit migrate
      - name: Generate BDD specs from .feature files
        # bddgen converts tests/e2e/features/*.feature into runnable
        # .spec.js files under tests/e2e/.features-gen/. Without it,
        # `playwright test` finds 0 tests.
        run: pnpm -F @familyhub/e2e exec bddgen test --config playwright.config.ts
      - name: Assert bddgen produced specs
        run: pnpm -F @familyhub/e2e run _assert-bddgen
      - name: Run e2e (project=${{ matrix.browser }})
        env:
          PROJECT: ${{ matrix.browser }}
          # FHS-700: the e2e account on our own staging sign-in service.
          E2E_USER_EMAIL: ${{ secrets.E2E_AUTH_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_AUTH_USER_PASSWORD }}
        run: pnpm -F @familyhub/e2e exec playwright test --config playwright.config.ts --project "$PROJECT"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tests/e2e/playwright-report/
          retention-days: 14
